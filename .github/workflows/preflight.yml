name: preflight

# 共通の入口（repo-preflight の preflight-gate）を SHA 固定で呼ぶ。
# 固定先: repo-preflightのbase-guard廃止後の統合済みcommit。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: nexus-ai-2045/repo-preflight/.github/workflows/preflight-gate.yml@fe2e90f91615a5e5ed3f9b2b497c99f5786e5847 # base-guard廃止版
    with:
      preflight-ref: fe2e90f91615a5e5ed3f9b2b497c99f5786e5847 # uses の @ と同じ統合済みSHA
  # 必須にするのはこの集約ジョブ。if: で飛ばしても skipped は成功にならず赤になる
  all-green:
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success
