name: preflight

# 共通の入口（repo-preflight の preflight-gate）を SHA 固定で呼ぶ。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: nexus-ai-2045/repo-preflight/.github/workflows/preflight-gate.yml@0915c2decb63762260c8063d79419aef6ee9db34
    with:
      preflight-ref: 0915c2decb63762260c8063d79419aef6ee9db34
  # 必須にするのはこの集約ジョブ。if: で飛ばしても skipped は成功にならず赤になる
  all-green:
    if: always()
    needs: [gate]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gate.result }}" = success
